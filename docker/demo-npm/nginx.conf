server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Declared explicitly rather than trusted to the base image's mime.types.
    # A .wasm served as application/octet-stream makes
    # `WebAssembly.instantiateStreaming` refuse the response, and the failure
    # reads as a library bug ("magic word not detected") rather than a server
    # misconfiguration. nginx has shipped this mapping since 1.21, so this is
    # belt-and-braces — but it costs one line and removes a whole class of
    # confusing report.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # ~470 KB raw, ~200 KB over the wire. Worth compressing; wasm is not in
    # nginx's default gzip_types.
    gzip on;
    gzip_types application/wasm application/javascript text/css text/html application/json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A liveness endpoint that does not depend on the app booting, so
    # "container is up" and "demo works" stay separable when diagnosing.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
